function setChannelTheme(card,theme){card.style.setProperty('--channel-accent',theme.accent);card.style.setProperty('--channel-deep',theme.deep);card.style.setProperty('--channel-soft',theme.soft);card.style.setProperty('--channel-border',theme.border)}
function applyChannelThemes(scope=document){scope.querySelectorAll('.channel[data-themeable="true"]').forEach(card=>{let img=card.querySelector('img');if(!img)return;let apply=()=>{try{setChannelTheme(card,readImageTheme(img))}catch(_){}};if(img.complete&&img.naturalWidth)apply();else{img.addEventListener('load',apply,{once:true})}})}
function yearView(){let ss=subjects().filter(x=>matchSearch(x.name,x.code||'',x.alias||''));return `${searchbar()}<main class="container main">${breadcrumbs()}<div class="section-intro"><div class="intro-flex"><span class="intro-icon">${ico('graduation')}</span><div><h1 class="info-title">السنة ${['الأولى','الثانية','الثالثة','الرابعة'][state.year-1]}</h1><p>مواد طب الأسنان وقنوات طلبة دفعتك</p></div></div></div><div class="layout"><div class="main-col" id="materials">${heading('المواد الدراسية',ss.length+' مادة في هذه القائمة')}<div class="grid subjects">${ss.length?ss.map((s,i)=>`<button class="card subject" data-subject="${safe(s.id)}"><span class="subject-icon">${ico(['book','layers','folder','file'][i%4])}</span><span style="flex:1;min-width:0"><strong>${safe(s.name)}</strong><span class="subline">${safe(s.code||'مادة مضافة')} · 10 شيتات</span></span><span class="arrow">${ico('right')}</span></button>`).join(''):empty('ما فيش مواد مطابقة','جرّب اسم المادة أو رمزها','','')}</div></div><aside class="side" id="channels">${heading('قنوات الطلبة','قنوات زملائك في السنة نفسها','add-channel','+ أضف قناتك')}${channelList()}</aside></div><div class="footnote">${ico('info')}<span>الإضافات المنشورة تظهر لجميع طلبة الدفعة بعد حفظها.</span></div></main>`}
function filterTabs(){return `<div class="type-tabs resource-tabs" role="group" aria-label="تصفية الإضافات">${TYPE_FILTERS.map(([t,label])=>`<button class="chip ${state.filter===t?'selected':''}" data-filter="${t}" aria-pressed="${state.filter===t}">${label}</button>`).join('')}</div>`}
function selectedResources(list){return list.filter(x=>(state.filter==='all'||x.type===state.filter)&&matchSearch(x.title,x.desc,x.type,types[x.type]||''))}
function resourceCard(r){let iconName=icons[r.type]||'link';let sh=r.sheet?sheetSlots(r.subject).find(x=>x.id===r.sheet):null;return `<article class="card resource resource-row"><div class="res-icon">${ico(iconName)}</div><div class="res-body"><div class="resource-tags"><span class="res-meta">${safe(types[r.type]||'رابط')}</span></div><strong>${safe(r.title)}</strong><p>${safe(r.desc||'لا يوجد وصف لهذا الرابط.')}</p></div><a class="btn btn-ghost btn-small resource-open" target="_blank" rel="noopener noreferrer" href="${safe(r.url)}">فتح الرابط ${ico('external')}</a></article>`}
function subjectView(){let sub=getSubject();if(!sub){state.view='year';return yearView()}let sl=sheets(),all=selectedResources(resources());let matchedSheets=sl.filter(sh=>matchSearch(sh.name,sh.desc));return `${searchbar()}<main class="container main">${breadcrumbs()}<div class="section-intro"><div class="intro-flex"><span class="intro-icon">${ico('book')}</span><div><h1 class="info-title">${safe(sub.name)}</h1><p>${safe(sub.code||'مادة دراسية')} · السنة ${['الأولى','الثانية','الثالثة','الرابعة'][state.year-1]}</p></div></div></div><div class="section"><div class="info-strip"><span class="info-strip-icon">${ico('layers')}</span><div><strong>إضافات المادة</strong><small>شيت، ملخص، قناة شرح، أسئلة، تسجيل صوتي أو أي رابط مفيد</small></div><span class="count-pill">${resources().length} إضافة</span></div>${filterTabs()}${all.length?all.map(resourceCard).join(''):empty('ما فيش إضافات في هذا القسم','أضف أول رابط مع عنوان ووصف لهذه المادة','add-resource','إضافة رابط')}</div><div class="section" id="sheets">${heading('شيتات المادة','10 شيتات جاهزة للتنظيم، اضغط على أي شيت لمشاهدة إضافاته')}<div class="grid sheets">${matchedSheets.map((sh,i)=>{let n=allResources().filter(x=>x.sheet===sh.id).length;return `<button class="card sheet" data-sheet="${safe(sh.id)}"><span class="sheet-icon">${ico('file')}</span><span style="flex:1;min-width:0"><strong>${safe(sh.name)}</strong><span class="subline">${n} إضافة · ملخصات وشروحات وأسئلة</span></span><span class="arrow">${ico('right')}</span></button>`}).join('')}</div></div></main>`}
function sheetView(){let sh=getSheet();if(!sh){state.view='subject';return subjectView()}let all=selectedResources(resources(sh.id));let sub=getSubject();return `${searchbar()}<main class="container main">${breadcrumbs()}<div class="section-intro"><div class="intro-flex"><span class="intro-icon">${ico('file')}</span><div><h1 class="info-title">${safe(sh.name)}</h1><p>${safe(sub?.name||'المادة')} · المصادر الخاصة بهذا الشيت</p></div></div>${btn(ico('plus')+' إضافة رابط','add-resource','btn btn-primary btn-small')}</div><div class="section">${heading('إضافات الشيت','ملخصات، شروحات، أسئلة وتسجيلات مرتبطة بهذا الشيت')}${filterTabs()}${all.length?all.map(resourceCard).join(''):empty('لا توجد إضافات لهذا الشيت','أضف رابط تيليجرام مع اسم يوضح المحتوى وشرح مختصر','add-resource','إضافة رابط')}</div></main>`}
function render(){let content=state.view==='home'?home():state.view==='year'?yearView():state.view==='subject'?subjectView():sheetView();app.innerHTML=header()+content+`<footer class="foot">دليلك الدراسي · ${sharedOnline?'إضافات مشتركة بين الطلبة':'عرض آخر بيانات محفوظة · تحتاج اتصالًا للتحديث والنشر'}</footer>`;applyChannelThemes(app);document.querySelector('#search')?.addEventListener('input',e=>{const v=e.target.value;state.search=v;const selected=document.activeElement;const position=selected.selectionStart;render();const el=document.querySelector('#search');if(el){el.focus();el.setSelectionRange(position,position)}})}
function openModal(type){let names={channel:'إضافة قناة طالب',subject:'إضافة مادة',sheet:'إضافة شيت',resource:'إضافة رابط أو مصدر'};let title=names[type];let content='';let simple=(name,label,placeholder='',required=true)=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" placeholder="${safe(placeholder)}" ${required?'required':''} maxlength="180"></div>`;
if(type==='channel')content=simple('name','اسم القناة','مثال: قناة دفعة السنة الثانية')+simple('url','رابط القناة','https://t.me/...')+`<div class="field"><label for="f-desc">وصف مختصر للقناة</label><textarea name="desc" id="f-desc" maxlength="500" placeholder="مثال: ملخصات المحاضرات والإعلانات المهمة"></textarea></div><div class="field"><label for="f-image">صورة القناة (اختياري)</label><input type="file" name="image" id="f-image" accept="image/png,image/jpeg,image/webp"><span class="hint">JPG أو PNG أو WebP وبحجم أقل من 1 ميغابايت.</span><img class="image-preview" id="preview" alt="معاينة الصورة"></div>`;
if(type==='subject')content=simple('name','اسم المادة','مثال: علم وظائف الأعضاء');
if(type==='sheet')content=simple('name','اسم الشيت','مثال: Sheet 01 – Introduction')+`<div class="field"><label for="f-desc">وصف الشيت (اختياري)</label><textarea id="f-desc" name="desc" maxlength="500" placeholder="مواضيع هذا الشيت"></textarea></div>`;
if(type==='resource'){
 if(!state.subject || (state.view!=='subject'&&state.view!=='sheet')){toast('اختر مادة أو شيت أولًا');return}
 content=`<div class="field"><label for="f-type">نوع الإضافة</label><select name="type" id="f-type" required>${ADD_TYPES.map(k=>`<option value="${k}">${types[k]}</option>`).join('')}</select></div>`+simple('title','اسم الإضافة','مثال: شرح Oral Histology – Lecture 1')+simple('url','رابط تيليجرام أو رابط خارجي','https://t.me/...')+`<div class="field"><label for="f-desc">وصف / ملخص محتوى الرابط</label><textarea name="desc" id="f-desc" maxlength="700" placeholder="مثال: يحتوي على شرح المحاضرة الأولى وتعريفاتها ومراجعة لأهم الأسئلة" required></textarea><span class="hint">اكتب للطلبة ماذا سيجدون عند فتح الرابط.</span></div>`;
}
const html=`<div class="modal-wrap" id="modalWrap" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="close" data-action="close" aria-label="إغلاق">×</button></div><form class="form-grid" id="addForm" data-type="${type}">${content}<div class="error" id="formError" aria-live="polite"></div><div class="form-actions"><button type="button" class="btn btn-ghost" data-action="close">إلغاء</button><button type="submit" class="btn btn-primary">حفظ الإضافة</button></div></form></div></div>`;
document.querySelector('#overlay').innerHTML=html;
let modal=document.querySelector('#modalWrap');modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});modal.querySelector('input,select')?.focus();
if(type==='channel'){document.querySelector('#f-image').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(file.size>1024*1024){document.querySelector('#formError').textContent='الصورة أكبر من 1 ميغابايت';e.target.value='';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){document.querySelector('#formError').textContent='نوع الصورة غير مدعوم';e.target.value='';return}let out=await toDataURL(file);let img=document.querySelector('#preview');if(img){img.src=out;img.style.display='block'}})}
document.querySelector('#addForm').addEventListener('submit',e=>submit(e,type))}
function toDataURL(file){return new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)})}
function closeModal(){document.querySelector('#overlay').innerHTML=''}
function validUrl(value){try{let url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.toString():null}catch{return null}}
async function submit(e,type){
e.preventDefault();
const form=e.currentTarget;
const d=new FormData(form);
const str=k=>String(d.get(k)||'').trim();
const err=document.querySelector('#formError');
err.textContent='';
const obj={id:id(),context:ctx(),createdAt:new Date().toISOString()};
const name=str('name');
const submitButton=form.querySelector('button[type="submit"]');
if(type==='channel'||type==='resource'){
  const url=validUrl(str('url'));
  if(!url){err.textContent='ضع رابطًا صحيحًا يبدأ بـ https:// أو http://';return}
  obj.url=url;
}
if(type==='channel'){
  obj.name=name;obj.desc=str('desc');
  const file=d.get('image');
  if(file instanceof File&&file.size){
    if(file.size>1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){err.textContent='اختر صورة JPG أو PNG أو WebP أصغر من 1 ميغابايت';return}
    obj.image=await toDataURL(file);
  }
}
if(type==='subject'){
  if(subjects().some(s=>s.name.toLocaleLowerCase('ar')===name.toLocaleLowerCase('ar'))){err.textContent='هذه المادة موجودة بالفعل';return}
  obj.name=name;
}
if(type==='sheet'){
  if(sheets().filter(x=>!x.id.startsWith('slot-')).length>=10){err.textContent='الحد الحالي 10 شيتات لكل مادة';return}
  obj.name=name;obj.desc=str('desc');obj.subject=state.subject;
}
if(type==='resource'){
  obj.title=str('title');obj.desc=str('desc');obj.type=str('type');obj.subject=state.subject;
  obj.sheet=state.view==='sheet'?state.sheet:null;
  if(!obj.subject||!subjects().some(s=>s.id===obj.subject)){err.textContent='اختر مادة صحيحة';return}
  if(obj.sheet&&!sheetSlots(obj.subject).some(sh=>sh.id===obj.sheet)){err.textContent='الشيت غير صالح';return}
}
if(submitButton){submitButton.disabled=true;submitButton.textContent='جارٍ النشر...'}
try{
  const row=await persistShared(type,obj);
  db[SB_COLLECTIONS[type]].unshift(row);
  cacheShared();
  closeModal();
  toast('تم نشر الإضافة لجميع الطلبة ✓');
  render();
}catch(error){
  if(document.querySelector('#formError'))document.querySelector('#formError').textContent='تعذر نشر الإضافة: '+(error.message||'تحقق من الاتصال');
}finally{
  if(submitButton){submitButton.disabled=false;submitButton.textContent='حفظ الإضافة'}
}
}
function toast(msg){const el=document.querySelector('#toasts');el.innerHTML=`<div class="toast">${safe(msg)}</div>`;setTimeout(()=>{if(el)el.innerHTML=''},2700)}
function nav(view){state.view=view;state.search='';state.filter='all';if(view==='home'){state.subject=null;state.sheet=null}if(view==='year'){state.subject=null;state.sheet=null}if(view==='subject'){state.sheet=null}render();scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-program],[data-year],[data-subject],[data-sheet],[data-filter],[data-nav],[data-link]');if(!target)return;let ds=target.dataset;if(ds.link==='home'){e.preventDefault();nav('home')}if(ds.program){state.program=ds.program;state.year=2;nav('home')}if(ds.year){state.year=Number(ds.year);nav('year')}if(ds.subject){state.subject=ds.subject;nav('subject')}if(ds.sheet){state.sheet=ds.sheet;nav('sheet')}if(ds.filter){state.filter=ds.filter;render()}if(ds.nav)nav(ds.nav);if(ds.action==='close')closeModal();if(ds.action==='add-channel')openModal('channel');if(ds.action==='add-subject')openModal('subject');if(ds.action==='add-sheet')openModal('sheet');if(ds.action==='add-resource')openModal('resource');if(ds.action==='add-any'){if(state.view==='home'){toast('اختر السنة أولًا لإضافة قناة أو مصدر');return}openModal(state.view==='year'?'channel':'resource')}if(ds.action==='search'){document.querySelector('#search')?.focus()}if(ds.action==='go-channels'){if(state.view==='home'){state.view='year';state.search='';state.filter='all';render()}else if(state.view!=='year'){state.view='year';state.search='';state.filter='all';render()}document.querySelector('#channels')?.scrollIntoView({behavior:'smooth',block:'start'})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();refreshShared();setInterval(()=>{if(document.visibilityState==='visible')refreshShared()},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshShared()});
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Offline cache:',err));});}</script>
</body>
</html>
