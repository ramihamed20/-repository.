<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1429">
<title>دليلك الدراسي | مستودع روابط الطلبة</title>
<style>
:root{--bg:#f5f7fb;--ink:#17223a;--muted:#718096;--navy:#111b35;--line:#e4e9f1;--teal:#079c96;--teal-dark:#087e7a;--light:#e7f8f4;--purple:#6856c5;--shadow:0 16px 50px rgba(22,36,62,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Arial",sans-serif;line-height:1.7}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #68d6cb;outline-offset:2px}.topbar{background:var(--navy);color:white;height:80px;display:flex;align-items:center;position:sticky;top:0;z-index:12}.top-inner,.container{max-width:1180px;margin:auto;width:100%;padding-left:26px;padding-right:26px}.top-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:900;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:#101d34;background:#63e0d0;font-size:24px}.top-right{display:flex;align-items:center;gap:10px}.top-note{color:#b2c0d6;font-size:12px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:12px;padding:11px 18px;min-height:43px;font-weight:700;transition:.15s;background:#fff;color:var(--ink)}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--teal);color:white}.btn-primary:hover{background:var(--teal-dark)}.btn-light{background:#fff;color:var(--navy)}.btn-ghost{background:transparent;border-color:#dce5ee}.btn-small{padding:7px 13px;min-height:36px;font-size:13px}.header-actions{display:flex;gap:9px}.hero{background:radial-gradient(circle at 14% 4%,rgba(88,219,199,.25),transparent 31%),linear-gradient(125deg,#142241 0%,#1a3453 74%,#164a58 100%);color:white;padding:48px 0 54px}.eyebrow{font-size:12px;background:#ffffff1e;border:1px solid #ffffff33;padding:5px 12px;border-radius:40px;display:inline-block;color:#c9f8ee}.hero h1{font-size:clamp(29px,4vw,49px);line-height:1.4;margin:15px 0 8px;letter-spacing:-.8px}.hero p{max-width:660px;color:#c7d5e5;font-size:15px}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:22px}.hero-art{width:190px;height:155px;border:1px solid #ffffff38;border-radius:27px;background:linear-gradient(135deg,#ffffff30,#ffffff08);display:grid;place-items:center;font-size:76px;transform:rotate(-6deg);flex-shrink:0}.search-wrap{margin-top:-26px;position:relative;z-index:2}.searchbar{display:flex;background:white;border-radius:17px;box-shadow:var(--shadow);padding:7px;align-items:center;gap:10px;border:1px solid #e8eef4}.searchbar span{font-size:20px;padding-right:10px}.searchbar input{border:0;outline:0;flex:1;min-width:0;padding:12px 5px;background:none;color:var(--ink)}.main{padding-top:37px;padding-bottom:75px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px}.heading h2{margin:0;font-size:23px}.heading p{margin:4px 0;color:var(--muted);font-size:13px}.grid{display:grid;gap:17px}.years{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:19px;box-shadow:0 6px 25px rgba(22,36,62,.025)}.year{padding:25px 14px;text-align:center;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}.year:hover,.subject:hover,.channel:hover,.sheet:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#8edbd3}.year-symbol{width:60px;height:60px;background:#ecf9f7;border-radius:18px;display:grid;place-items:center;margin:0 auto 13px;font-size:28px}.year strong{display:block;font-size:17px}.year small,.subline{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 305px;gap:23px}.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}.subject{display:flex;align-items:center;gap:14px;padding:18px;text-align:right;cursor:pointer;transition:.2s;min-width:0}.subject-icon{height:52px;width:52px;border-radius:16px;background:#eef2ff;display:grid;place-items:center;font-size:23px;flex-shrink:0}.subject strong,.channel strong,.sheet strong{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis}.subject .arrow{margin-right:auto;font-size:19px;color:#99a9ba}.side{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;height:max-content}.side .heading h2{font-size:17px}.channel{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid #eef1f6;margin:9px 0;transition:.2s}.avatar{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#dcf2f4;overflow:hidden;font-size:23px;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.linkpill{color:var(--teal-dark);font-size:12px;font-weight:700}.crumbs{display:flex;align-items:center;gap:8px;color:#64748b;font-size:13px;margin:24px 0 18px;flex-wrap:wrap}.crumbs button{border:0;background:none;color:#497b87;cursor:pointer;padding:3px}.small-stat{background:#e9f7f4;color:#108078;padding:4px 9px;border-radius:8px;font-size:12px}.section{margin-bottom:29px}.sheets{grid-template-columns:repeat(2,minmax(0,1fr))}.sheet{cursor:pointer;display:flex;align-items:center;gap:13px;padding:20px;text-align:right;transition:.2s}.sheet-icon{font-size:23px;background:#fff3ea;border-radius:13px;padding:10px}.sheet .arrow{margin-right:auto;color:#8697a8}.resource{padding:16px 18px;margin-bottom:11px;display:flex;align-items:start;gap:13px}.res-icon{font-size:22px;flex-shrink:0;background:#f0f7fc;padding:8px;border-radius:12px}.res-body{flex:1;min-width:0}.res-body strong{display:block;font-size:15px}.res-body p{margin:4px 0 9px;font-size:13px;color:#65758a;word-break:break-word}.res-meta{font-size:11px;color:#687b8d;background:#f2f5f9;border-radius:6px;padding:3px 8px;display:inline-block}.resource .btn{align-self:center;white-space:nowrap}.type-tabs,.program-select{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #dce5ee;background:white;border-radius:11px;padding:8px 15px;color:#596c81;font-weight:700;font-size:13px}.chip.selected{color:#fff;border-color:var(--navy);background:var(--navy)}.program-select{margin-top:21px}.program-select .chip{background:#ffffff14;border-color:#ffffff28;color:#d5e7f4}.program-select .chip.selected{background:#fff;color:var(--navy)}.type-tabs{margin:0 0 18px}.empty{text-align:center;padding:30px 15px;border:1px dashed #d4dfe9;background:#fafcfe;border-radius:16px;color:#748398}.empty .big{font-size:30px;display:block;margin-bottom:4px}.empty strong{display:block;color:#3f536a}.empty p{margin:4px 0 16px;font-size:13px}.notice{color:#647b8d;background:#ebf3f8;border-radius:13px;padding:11px 15px;font-size:12px;margin-bottom:22px}.modal-wrap{position:fixed;inset:0;z-index:20;background:rgba(7,15,31,.7);display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,560px);max-height:93vh;overflow:auto;background:#fff;border-radius:22px;padding:25px;box-shadow:0 22px 80px #0005}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:21px;margin:0}.close{border:0;border-radius:10px;background:#f0f3f7;font-size:23px;width:38px;height:38px}.form-grid{display:grid;gap:13px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #dce5ee;border-radius:12px;padding:11px 12px;color:var(--ink);background:white}.field textarea{min-height:80px;resize:vertical}.field .hint{font-size:11px;color:#7b8799}.error{color:#b42b41;font-size:13px;margin-top:5px;min-height:0}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:5px}.image-preview{width:58px;height:58px;object-fit:cover;border-radius:12px;display:none}.toast{position:fixed;bottom:24px;right:24px;z-index:22;background:#113c3d;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow)}.foot{font-size:12px;color:#77879c;text-align:center;padding:15px 0 40px}.link-quiet{background:none;border:0;color:#067e7c;cursor:pointer;text-decoration:underline;font-weight:700}.info-title{margin:2px 0 14px;font-size:27px}.title-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:900px){.years{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{order:1}.main-col{order:0}.hero-art{display:none}}@media(max-width:600px){.topbar{height:67px}.top-inner,.container{padding-left:16px;padding-right:16px}.brand{font-size:17px}.brand-mark{height:35px;width:35px;font-size:19px}.top-note{display:none}.header-actions .btn{padding:7px 10px;font-size:12px;min-height:35px}.hero{padding:30px 0 56px}.hero h1{font-size:30px}.hero p{font-size:13px}.main{padding-top:25px}.years{grid-template-columns:repeat(2,1fr)}.subjects,.sheets{grid-template-columns:1fr}.heading h2{font-size:20px}.resource{flex-wrap:wrap}.resource .btn{margin-right:auto}.modal{padding:18px}.grid{gap:11px}}
</style>
</head>
<body>
<div id="app"></div><div id="overlay"></div><div id="toasts"></div>
<script>
(()=>{'use strict';
const PROGRAMS=[{id:'dentistry',name:'طب الأسنان',icon:'🦷',years:5},{id:'medicine',name:'الطب البشري',icon:'🩺',years:6}];
const DEFAULT_SUBJECTS={'dentistry-2':['علم وظائف الأعضاء','الكيمياء الحيوية','التشريح','أنسجة الفم','التعويضات السنية'],'dentistry-1':['التشريح العام','علم الأحياء','الكيمياء الطبية']};
const STORAGE='student-resource-hub-v1';
function readData(){try{const raw=JSON.parse(localStorage.getItem(STORAGE));if(raw&&raw.version===1)return raw}catch{}return {version:1,subjects:[],channels:[],sheets:[],resources:[]}}
let db=readData();let state={program:'dentistry',year:2,view:'home',subject:null,sheet:null,filter:'all',search:''};
function safe(t){return String(t??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function id(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function save(){localStorage.setItem(STORAGE,JSON.stringify(db))}
function ctx(){return state.program+'-'+state.year}
function subjects(){const items=db.subjects.filter(x=>x.context===ctx());const built=DEFAULT_SUBJECTS[ctx()]||[];return [...built.filter(name=>!items.some(x=>x.name===name)).map((name,i)=>({id:'seed-'+ctx()+'-'+i,name,context:ctx()})),...items]}
function channels(){return db.channels.filter(x=>x.context===ctx())}
function getSubject(){return subjects().find(x=>x.id===state.subject)}
function getSheet(){return db.sheets.find(x=>x.id===state.sheet)}
function sheets(){return db.sheets.filter(x=>x.context===ctx()&&x.subject===state.subject)}
function resources(sheetId=null){return db.resources.filter(x=>x.context===ctx()&&x.subject===state.subject&&(sheetId===null?x.sheet===null:x.sheet===sheetId))}
function matchSearch(...parts){return !state.search||parts.join(' ').toLocaleLowerCase('ar').includes(state.search.toLocaleLowerCase('ar'))}
const icons={summary:'📝',video:'🎬',audio:'🎧',pdf:'📄',telegram:'📣',other:'🔗'};
const types={summary:'ملخص',video:'شرح فيديو',audio:'تسجيل صوتي',pdf:'شيت / ملف',telegram:'قناة شرح',other:'رابط آخر'};
const app=document.querySelector('#app');
function btn(label,action,cls='btn btn-primary',other=''){return `<button type="button" class="${cls}" data-action="${action}" ${other}>${label}</button>`}
function heading(title,subtitle='',action='',label=''){return `<div class="heading"><div><h2>${safe(title)}</h2>${subtitle?`<p>${safe(subtitle)}</p>`:''}</div>${action?btn(label,action,'btn btn-ghost btn-small'):''}</div>`}
function empty(title,detail,action,label){return `<div class="empty"><span class="big">📭</span><strong>${safe(title)}</strong><p>${safe(detail)}</p>${action?btn(label,action,'btn btn-primary btn-small'):''}</div>`}
function header(){return `<header class="topbar"><div class="top-inner"><a href="#" class="brand" data-link="home"><span class="brand-mark">✦</span><span>دليلك الدراسي</span></a><div class="top-right"><span class="top-note">كل مصادر دفعتك في مكان واحد</span><div class="header-actions">${btn('＋ إضافة رابط','add-any','btn btn-light btn-small')}</div></div></div></header>`}
function hero(){let p=PROGRAMS.find(x=>x.id===state.program);return `<section class="hero"><div class="container"><div class="hero-top"><div><span class="eyebrow">مستودع تشاركي يصنعه الطلبة 📚</span><h1>الطريق الأقصر لكل<br>مصادرك الدراسية.</h1><p>اختر سنتك، تصفح المواد وقنوات زملائك، واكتشف شروح وملخصات وتسجيلات كل شيت.</p></div><div class="hero-art">📚</div></div><div class="program-select">${PROGRAMS.map(x=>`<button class="chip ${state.program===x.id?'selected':''}" data-program="${x.id}">${x.icon} ${x.name}</button>`).join('')}</div></div></section>`}
function searchbar(){return `<div class="container search-wrap"><div class="searchbar"><span>🔎</span><input id="search" placeholder="ابحث عن مادة أو قناة أو شيت أو شرح..." value="${safe(state.search)}" aria-label="بحث"><button class="btn btn-small btn-primary" data-action="search">بحث</button></div></div>`}
function home(){let p=PROGRAMS.find(x=>x.id===state.program);return `${hero()}${searchbar()}<main class="container main">${heading('اختر السنة الدراسية','اختر سنتك للوصول إلى موادك وقنوات الطلبة')}<div class="grid years">${Array.from({length:p.years},(_,i)=>{let n=i+1;let s=db.subjects.filter(x=>x.context===state.program+'-'+n).length+(DEFAULT_SUBJECTS[state.program+'-'+n]||[]).length;return `<button class="card year" data-year="${n}"><span class="year-symbol">${['📖','📘','🧠','🔬','🎓','🏥'][i]}</span><strong>السنة ${['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'][i]}</strong><small>${s?s+' مواد مبدئيًا':'استكشف وأضف المواد'} ←</small></button>`}).join('')}</div><div style="margin-top:30px" class="notice">✨ هذا نموذج تفاعلي أولي: ما تضيفه هنا يُحفظ على جهازك فقط. مشاركة البيانات بين كل الطلبة تحتاج ربط الموقع بقاعدة بيانات وخادم.</div></main>`}
function breadcrumbs(){let xs=[`<button data-nav="home">الرئيسية</button>`];xs.push('<span>›</span>');xs.push(`<button data-nav="year">السنة ${['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'][state.year-1]}</button>`);if(state.view==='subject'||state.view==='sheet'){xs.push('<span>›</span>');xs.push(`<button data-nav="subject">${safe(getSubject()?.name||'المادة')}</button>`)}if(state.view==='sheet'){xs.push('<span>›</span><span>'+safe(getSheet()?.name||'الشيت')+'</span>')}return `<nav class="crumbs" aria-label="مسار التصفح">${xs.join('')}</nav>`}
function channelList(){let q=channels().filter(x=>matchSearch(x.name,x.desc));return q.length?q.map(x=>`<div class="channel"><div class="avatar">${x.image?`<img src="${safe(x.image)}" alt="صورة قناة ${safe(x.name)}">`:'📣'}</div><div style="min-width:0;flex:1"><strong>${safe(x.name)}</strong><div class="subline">${safe(x.desc||'قناة طلابية')}</div><a href="${safe(x.url)}" target="_blank" rel="noopener noreferrer" class="linkpill">فتح القناة ↗</a></div></div>`).join(''):empty('لا توجد قنوات بعد','كن أول من يضيف قناته للدفعة','add-channel','＋ إضافة قناة')}
function yearView(){let p=PROGRAMS.find(x=>x.id===state.program);let ss=subjects().filter(x=>matchSearch(x.name));return `${hero()}${searchbar()}<main class="container main">${breadcrumbs()}<div class="title-row"><div><h1 class="info-title">${p.icon} السنة ${['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'][state.year-1]}</h1><p class="subline">${safe(p.name)} · تصفح المواد وقنوات طلبة دفعتك</p></div></div><div class="layout"><div class="main-col">${heading('المواد الدراسية','اختر المادة لتظهر شيتاتها والشروح المتعلقة بها','add-subject','＋ إضافة مادة')}<div class="grid subjects">${ss.length?ss.map((s,i)=>`<button class="card subject" data-subject="${safe(s.id)}"><span class="subject-icon">${['🧬','⚗️','🫀','🦷','🔬','📚'][i%6]}</span><span style="flex:1;min-width:0"><strong>${safe(s.name)}</strong><span class="subline">شيتات، شروح، ملخصات</span></span><span class="arrow">←</span></button>`).join(''):empty('لا توجد مواد هنا','أضف مادة جديدة لدفعتك','add-subject','＋ إضافة مادة')}</div></div><aside class="side">${heading('📣 قنوات الطلبة','','add-channel','＋ أضف قناتك')}${channelList()}</aside></div></main>`}
function resourceCard(r){return `<article class="card resource"><div class="res-icon">${icons[r.type]||icons.other}</div><div class="res-body"><strong>${safe(r.title)}</strong><p>${safe(r.desc||'لا يوجد وصف لهذا الرابط.')}</p><span class="res-meta">${types[r.type]||types.other}</span></div><a class="btn btn-ghost btn-small" target="_blank" rel="noopener noreferrer" href="${safe(r.url)}">فتح الرابط ↗</a></article>`}
function subjectView(){let sub=getSubject();if(!sub){state.view='year';return yearView()}let q=sheets().filter(x=>matchSearch(x.name,x.desc));let rs=resources().filter(x=>matchSearch(x.title,x.desc));return `${hero()}${searchbar()}<main class="container main">${breadcrumbs()}<div class="title-row"><div><h1 class="info-title">📘 ${safe(sub.name)}</h1><p class="subline">ادخل أي شيت لرؤية الملخصات والشروح والتسجيلات المضافة له</p></div>${btn('＋ إضافة مصدر','add-resource','btn btn-primary btn-small')}</div><div class="section" style="margin-top:25px">${heading('الشيتات','اختر الشيت المطلوب أو أضف شيتًا جديدًا','add-sheet','＋ إضافة شيت')}<div class="grid sheets">${q.length?q.map(sh=>{let n=resources(sh.id).length;return `<button class="card sheet" data-sheet="${safe(sh.id)}"><div class="sheet-icon">📄</div><div style="flex:1;min-width:0"><strong>${safe(sh.name)}</strong><div class="subline">${n} مصدر · ${safe(sh.desc||'افتح المصادر المتاحة')}</div></div><span class="arrow">←</span></button>`}).join(''):empty('لا توجد شيتات','أضف أول شيت وابدأ تجميع المصادر له','add-sheet','＋ إضافة شيت')}</div></div><div class="section">${heading('قنوات الشرح والمصادر العامة','مصادر تخص المادة كلها وليست شيتًا محددًا')}${rs.length?rs.map(resourceCard).join(''):empty('لا توجد مصادر عامة','أضف رابط شرح أو قناة أو مرجع للمادة','add-resource','＋ إضافة مصدر')}</div></main>`}
function sheetView(){let sh=getSheet();if(!sh){state.view='subject';return subjectView()}let list=resources(sh.id).filter(x=>matchSearch(x.title,x.desc));if(state.filter!=='all')list=list.filter(x=>x.type===state.filter);return `${hero()}${searchbar()}<main class="container main">${breadcrumbs()}<div class="title-row"><div><h1 class="info-title">📄 ${safe(sh.name)}</h1><p class="subline">${safe(sh.desc||'كل الروابط والشروحات الخاصة بهذا الشيت')}</p></div>${btn('＋ إضافة رابط للشيت','add-resource','btn btn-primary btn-small')}</div><div class="section" style="margin-top:25px">${heading('مصادر الشيت','اختر نوع المصدر لرؤية الروابط المتاحة')}<div class="type-tabs">${[['all','كل المصادر'],['summary','الملخصات'],['video','شرح الفيديو'],['audio','التسجيلات'],['pdf','الملفات'],['telegram','القنوات']].map(([t,label])=>`<button class="chip ${state.filter===t?'selected':''}" data-filter="${t}">${label}</button>`).join('')}</div>${list.length?list.map(resourceCard).join(''):empty('لا توجد مصادر مطابقة','أضف رابطًا مع وصف مختصر لما يحتوي عليه','add-resource','＋ إضافة مصدر')}</div></main>`}
function render(){let content=state.view==='home'?home():state.view==='year'?yearView():state.view==='subject'?subjectView():sheetView();app.innerHTML=header()+content+`<footer class="foot">دليلك الدراسي · نسخة تجريبية أولية</footer>`;document.querySelector('#search')?.addEventListener('input',e=>{const v=e.target.value;state.search=v;const selected=document.activeElement;const position=selected.selectionStart;render();const el=document.querySelector('#search');el.focus();el.setSelectionRange(position,position)})}
function openModal(type){let names={channel:'إضافة قناة طالب',subject:'إضافة مادة',sheet:'إضافة شيت',resource:'إضافة رابط أو مصدر'};let title=names[type];let content='';let simple=(name,label,placeholder='',required=true)=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" placeholder="${safe(placeholder)}" ${required?'required':''} maxlength="180"></div>`;
if(type==='channel')content=simple('name','اسم القناة','مثال: قناة دفعة السنة الثانية')+simple('url','رابط القناة','https://t.me/...')+`<div class="field"><label for="f-desc">وصف مختصر للقناة</label><textarea name="desc" id="f-desc" maxlength="500" placeholder="مثال: ملخصات المحاضرات والإعلانات المهمة"></textarea></div><div class="field"><label for="f-image">صورة القناة (اختياري)</label><input type="file" name="image" id="f-image" accept="image/png,image/jpeg,image/webp"><span class="hint">JPG أو PNG أو WebP وبحجم أقل من 1 ميغابايت.</span><img class="image-preview" id="preview" alt="معاينة الصورة"></div>`;
if(type==='subject')content=simple('name','اسم المادة','مثال: علم وظائف الأعضاء');
if(type==='sheet')content=simple('name','اسم الشيت','مثال: Sheet 01 – Introduction')+`<div class="field"><label for="f-desc">وصف الشيت (اختياري)</label><textarea id="f-desc" name="desc" maxlength="500" placeholder="مواضيع هذا الشيت"></textarea></div>`;
if(type==='resource'){let subjectOpts=subjects().map(s=>`<option value="${safe(s.id)}" ${state.subject===s.id?'selected':''}>${safe(s.name)}</option>`).join('');if(!subjectOpts){toast('أضف مادة أولًا');return}let sid=state.subject||subjects()[0].id;let shOpts=db.sheets.filter(s=>s.subject===sid&&s.context===ctx());content=`<div class="field"><label for="f-subject">المادة</label><select name="subject" id="f-subject" required>${subjectOpts}</select></div><div class="field"><label for="f-sheet">ربط المصدر بشيت (اختياري)</label><select name="sheet" id="f-sheet"><option value="">مصدر عام للمادة</option>${shOpts.map(s=>`<option ${state.sheet===s.id?'selected':''} value="${safe(s.id)}">${safe(s.name)}</option>`).join('')}</select></div><div class="field"><label for="f-type">نوع المصدر</label><select name="type" id="f-type">${Object.entries(types).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>`+simple('title','عنوان الرابط','مثال: شرح المحاضرة الأولى')+simple('url','رابط المصدر','https://...')+`<div class="field"><label for="f-desc">ماذا يحتوي الرابط؟</label><textarea name="desc" id="f-desc" maxlength="700" placeholder="اكتب ملخصًا مفيدًا: ما المواضيع التي يشرحها الرابط؟" required></textarea></div>`}
const html=`<div class="modal-wrap" id="modalWrap" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="close" data-action="close" aria-label="إغلاق">×</button></div><form class="form-grid" id="addForm" data-type="${type}">${content}<div class="error" id="formError" aria-live="polite"></div><div class="form-actions"><button type="button" class="btn btn-ghost" data-action="close">إلغاء</button><button type="submit" class="btn btn-primary">حفظ الإضافة</button></div></form></div></div>`;
document.querySelector('#overlay').innerHTML=html;
let modal=document.querySelector('#modalWrap');modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});modal.querySelector('input,select')?.focus();
if(type==='channel'){document.querySelector('#f-image').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(file.size>1024*1024){document.querySelector('#formError').textContent='الصورة أكبر من 1 ميغابايت';e.target.value='';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){document.querySelector('#formError').textContent='نوع الصورة غير مدعوم';e.target.value='';return}let out=await toDataURL(file);let img=document.querySelector('#preview');if(img){img.src=out;img.style.display='block'}})}
if(type==='resource'){document.querySelector('#f-subject').addEventListener('change',e=>{let list=db.sheets.filter(s=>s.subject===e.target.value&&s.context===ctx());document.querySelector('#f-sheet').innerHTML='<option value="">مصدر عام للمادة</option>'+list.map(s=>`<option value="${safe(s.id)}">${safe(s.name)}</option>`).join('')})}
document.querySelector('#addForm').addEventListener('submit',e=>submit(e,type))}
function toDataURL(file){return new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)})}
function closeModal(){document.querySelector('#overlay').innerHTML=''}
function validUrl(value){try{let url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.toString():null}catch{return null}}
async function submit(e,type){e.preventDefault();const form=e.currentTarget;const d=new FormData(form);const str=k=>String(d.get(k)||'').trim();const err=document.querySelector('#formError');err.textContent='';let obj={id:id(),context:ctx(),createdAt:new Date().toISOString()};let name=str('name');
if(type==='channel'||type==='resource'){let url=validUrl(str('url'));if(!url){err.textContent='ضع رابطًا صحيحًا يبدأ بـ https:// أو http://';return}obj.url=url}
if(type==='channel'){obj.name=name;obj.desc=str('desc');let file=d.get('image');if(file instanceof File&&file.size){if(file.size>1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){err.textContent='اختر صورة JPG أو PNG أو WebP أصغر من 1 ميغابايت';return}obj.image=await toDataURL(file)}db.channels.push(obj)}
if(type==='subject'){if(subjects().some(s=>s.name.toLocaleLowerCase('ar')===name.toLocaleLowerCase('ar'))){err.textContent='هذه المادة موجودة بالفعل';return}obj.name=name;db.subjects.push(obj)}
if(type==='sheet'){obj.name=name;obj.desc=str('desc');obj.subject=state.subject;db.sheets.push(obj)}
if(type==='resource'){obj.title=str('title');obj.desc=str('desc');obj.type=str('type');obj.subject=str('subject');obj.sheet=str('sheet')||null;db.resources.push(obj)}
try{save()}catch(ex){err.textContent='تعذر الحفظ؛ ربما امتلأت مساحة التخزين على الجهاز. جرّب صورة أصغر.';return}closeModal();toast('تمت الإضافة على جهازك بنجاح ✓');render()}
function toast(msg){const el=document.querySelector('#toasts');el.innerHTML=`<div class="toast">${safe(msg)}</div>`;setTimeout(()=>{if(el)el.innerHTML=''},2700)}
function nav(view){state.view=view;state.search='';state.filter='all';if(view==='home'){state.subject=null;state.sheet=null}if(view==='year'){state.subject=null;state.sheet=null}if(view==='subject'){state.sheet=null}render();scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-program],[data-year],[data-subject],[data-sheet],[data-filter],[data-nav],[data-link]');if(!target)return;let ds=target.dataset;if(ds.link==='home'){e.preventDefault();nav('home')}if(ds.program){state.program=ds.program;state.year=2;nav('home')}if(ds.year){state.year=Number(ds.year);nav('year')}if(ds.subject){state.subject=ds.subject;nav('subject')}if(ds.sheet){state.sheet=ds.sheet;nav('sheet')}if(ds.filter){state.filter=ds.filter;render()}if(ds.nav)nav(ds.nav);if(ds.action==='close')closeModal();if(ds.action==='add-channel')openModal('channel');if(ds.action==='add-subject')openModal('subject');if(ds.action==='add-sheet')openModal('sheet');if(ds.action==='add-resource')openModal('resource');if(ds.action==='add-any'){if(state.view==='home'){toast('اختر السنة أولًا لإضافة قناة أو مصدر');return}openModal(state.view==='year'?'channel':'resource')}if(ds.action==='search'){document.querySelector('#search')?.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
})();
</script>
</body>
</html>
