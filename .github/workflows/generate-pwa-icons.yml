name: Generate PWA icons
on:
  push:
    paths:
      - 'icons/icon.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render touch and app icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io
          import cairosvg
          from PIL import Image
          for size,name in [(192,"icon-192.png"),(512,"icon-512.png"),(180,"apple-touch-icon.png")]:
              raw=cairosvg.svg2png(url="icons/icon.svg",output_width=size,output_height=size)
              img=Image.open(io.BytesIO(raw)).convert("RGB").quantize(colors=24)
              img.save("icons/"+name,optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG app icons"
            git push
          fi
